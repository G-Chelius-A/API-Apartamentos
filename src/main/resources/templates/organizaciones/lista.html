<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Organizaciones')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid px-4 py-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Organizaciones y Empresas</h3>
                <p class="text-muted small mb-0">Perfiles fiscales y corporativos asociados a usuarios</p>
            </div>
            <a th:href="@{/vista/organizaciones/nueva}" class="btn btn-primary">
                <i class="bi bi-building-add me-1"></i> Registrar Organización
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID / Usuario</th>
                                <th>Razón Social</th>
                                <th>Nombre Comercial</th>
                                <th>RFC</th>
                                <th>Fecha Constitución</th>
                                <th>Dirección Fiscal</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(organizaciones)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay organizaciones registradas.
                                </td>
                            </tr>
                            <tr th:each="o : ${organizaciones}">
                                <td class="fw-bold">
                                    <span th:text="'#' + ${o.idUsuario}">#1</span>
                                    <small class="text-muted d-block" th:if="${o.usuario != null}" th:text="${o.usuario.username}"></small>
                                </td>
                                <td><span class="fw-semibold" th:text="${o.razonSocial}">Inmobiliaria SA</span></td>
                                <td><span th:text="${o.nombreComercial}">Blue Rentals</span></td>
                                <td><span class="badge bg-light text-dark border font-monospace" th:text="${o.rfc}">XAXX010101000</span></td>
                                <td><span th:text="${o.fechaConstitucion}">2020-01-15</span></td>
                                <td><small class="text-muted text-truncate d-inline-block" style="max-width: 250px;" th:text="${o.direccionFiscal}"></small></td>
                                <td class="text-end">
                                    <form th:action="@{/vista/organizaciones/{id}/eliminar(id=${o.idUsuario})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar esta organización?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
