<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Registrar Organización')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container py-2" style="max-width: 650px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0">Registrar Organización / Empresa</h3>
            <a th:href="@{/vista/organizaciones}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Regresar
            </a>
        </div>

        <div class="card p-4">
            <form th:action="@{/vista/organizaciones/guardar}" th:object="${organizacion}" method="post">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Cuenta de Usuario Asociada *</label>
                        <select th:field="*{idUsuario}" class="form-select" required>
                            <option value="">-- Seleccionar Usuario --</option>
                            <option th:each="u : ${usuarios}" th:value="${u.idUsuario}" th:text="'#' + ${u.idUsuario} + ' - ' + ${u.username} + ' (' + ${u.email} + ')'"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Razón Social *</label>
                        <input type="text" th:field="*{razonSocial}" class="form-control" required maxlength="200"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nombre Comercial *</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-control" required maxlength="150"/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">RFC *</label>
                        <input type="text" th:field="*{rfc}" class="form-control" required maxlength="13"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Fecha de Constitución *</label>
                        <input type="date" th:field="*{fechaConstitucion}" class="form-control" required/>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Dirección Fiscal Completa *</label>
                        <textarea th:field="*{direccionFiscal}" class="form-control" rows="2" required></textarea>
                    </div>

                    <div class="col-12 mt-4 text-end">
                        <a th:href="@{/vista/organizaciones}" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Guardar Organización
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
