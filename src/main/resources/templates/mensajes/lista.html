<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Mensajes')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid px-4 py-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Mensajería y Notificaciones</h3>
                <p class="text-muted small mb-0">Comunicaciones entre anfitriones y huéspedes respecto a reservaciones</p>
            </div>
            <a th:href="@{/vista/mensajes/nuevo}" class="btn btn-primary">
                <i class="bi bi-send me-1"></i> Redactar Mensaje
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Remitente</th>
                                <th>Destinatario</th>
                                <th>Reservación</th>
                                <th>Asunto y Contenido</th>
                                <th>Fecha Envío</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(mensajes)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay mensajes registrados.
                                </td>
                            </tr>
                            <tr th:each="m : ${mensajes}">
                                <td class="fw-bold" th:text="'#' + ${m.idMensaje}">#1</td>
                                <td>
                                    <span class="fw-semibold" th:text="${m.remitente != null ? m.remitente.username : 'N/A'}">propietario</span>
                                </td>
                                <td>
                                    <span class="fw-semibold" th:text="${m.destinatario != null ? m.destinatario.username : 'N/A'}">cliente</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" 
                                          th:text="${m.reservacion != null ? m.reservacion.codigoReserva : 'N/A'}">COD-123</span>
                                </td>
                                <td>
                                    <div class="fw-bold" th:text="${m.asunto}">Instrucciones de llegada</div>
                                    <small class="text-muted text-truncate d-inline-block" style="max-width: 350px;" th:text="${m.contenido}"></small>
                                </td>
                                <td><small class="text-muted" th:text="${m.fechaEnvio}">2026-10-13</small></td>
                                <td class="text-end">
                                    <form th:action="@{/vista/mensajes/{id}/eliminar(id=${m.idMensaje})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar este mensaje?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
