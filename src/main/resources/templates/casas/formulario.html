<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${casa.idCasa != null ? 'Editar Casa' : 'Registrar Casa'})}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container py-2" style="max-width: 700px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0" th:text="${casa.idCasa != null ? 'Editar Casa #' + casa.idCasa : 'Registrar Casa'}">Formulario Casa</h3>
            <a th:href="@{/vista/casas}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Regresar
            </a>
        </div>

        <div class="card p-4">
            <form th:action="@{/vista/casas/guardar}" th:object="${casa}" method="post">
                <input type="hidden" th:field="*{idCasa}"/>

                <div class="row g-3">
                    <div class="col-12" th:if="${casa.idCasa == null}">
                        <label class="form-label fw-semibold">Unidad Rentable Asociada *</label>
                        <select th:field="*{unidad.idUnidad}" class="form-select" required>
                            <option value="">-- Seleccionar Unidad Rentable --</option>
                            <option th:each="u : ${unidades}" th:value="${u.idUnidad}" th:text="'#' + ${u.idUnidad} + ' - ' + ${u.titulo} + ' (' + ${u.ciudad} + ')'"></option>
                        </select>
                        <small class="text-muted">La casa comparte identificador 1 a 1 con la unidad seleccionada.</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Número de Habitaciones *</label>
                        <input type="number" th:field="*{numeroHabitaciones}" class="form-control" min="1" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Número de Pisos *</label>
                        <input type="number" th:field="*{numeroPisos}" class="form-control" min="1" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Número de Baños *</label>
                        <input type="number" th:field="*{numeroBanos}" class="form-control" min="1" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Metros Cuadrados (m²) *</label>
                        <input type="number" step="0.01" th:field="*{metrosCuadrados}" class="form-control" min="1" required/>
                    </div>

                    <div class="col-12 mt-4 text-end">
                        <a th:href="@{/vista/casas}" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Guardar Casa
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
