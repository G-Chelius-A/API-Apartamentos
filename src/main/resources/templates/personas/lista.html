<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Personas')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid px-4 py-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Personas Físicas</h3>
                <p class="text-muted small mb-0">Perfiles de identidad personal asociados a usuarios</p>
            </div>
            <a th:href="@{/vista/personas/nueva}" class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i> Registrar Persona
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID / Usuario</th>
                                <th>Nombre Completo</th>
                                <th>Documento de Identidad</th>
                                <th>Fecha Nacimiento</th>
                                <th>Dirección</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(personas)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay perfiles de persona registrados.
                                </td>
                            </tr>
                            <tr th:each="p : ${personas}">
                                <td class="fw-bold">
                                    <span th:text="'#' + ${p.idUsuario}">#1</span>
                                    <small class="text-muted d-block" th:if="${p.usuario != null}" th:text="${p.usuario.username}"></small>
                                </td>
                                <td><span class="fw-semibold" th:text="${p.nombre} + ' ' + ${p.apellido}">Juan Perez</span></td>
                                <td><span class="badge bg-light text-dark border font-monospace" th:text="${p.documentoIdentidad}">INE-123</span></td>
                                <td><span th:text="${p.fechaNacimiento}">1995-05-10</span></td>
                                <td><small class="text-muted text-truncate d-inline-block" style="max-width: 250px;" th:text="${p.direccion}"></small></td>
                                <td class="text-end">
                                    <form th:action="@{/vista/personas/{id}/eliminar(id=${p.idUsuario})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar este perfil?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
