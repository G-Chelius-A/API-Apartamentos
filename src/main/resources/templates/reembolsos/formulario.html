<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Solicitar Reembolso')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container py-2" style="max-width: 650px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0">Solicitar Reembolso</h3>
            <a th:href="@{/vista/reembolsos}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Regresar
            </a>
        </div>

        <div class="card p-4">
            <div class="alert alert-info py-2 small mb-3">
                <i class="bi bi-info-circle-fill me-1"></i> Recuerde que por regla de negocio, solo se pueden reembolsar pagos con estado <strong>aceptado</strong> pertenecientes a reservaciones en estado <strong>cancelada</strong>.
            </div>

            <form th:action="@{/vista/reembolsos/guardar}" th:object="${reembolso}" method="post">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Pago Aceptado a Reembolsar *</label>
                        <select th:field="*{pago.idPago}" class="form-select" required>
                            <option value="">-- Seleccionar Pago --</option>
                            <option th:each="p : ${pagos}" th:value="${p.idPago}" 
                                    th:text="'Pago #' + ${p.idPago} + ' ($' + ${p.monto} + ' - ' + ${p.estado} + ')' + (p.reservacion != null ? ' - Reserva ' + p.reservacion.codigoReserva + ' (' + p.reservacion.estado + ')' : '')"></option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Monto del Reembolso ($)</label>
                        <input type="number" step="0.01" th:field="*{montoReembolso}" class="form-control" placeholder="Dejar vacío para el saldo total reembolsable del pago"/>
                        <small class="text-muted">Si no especifica el monto, se calculará automáticamente el monto máximo disponible.</small>
                    </div>

                    <div class="col-12 mt-4 text-end">
                        <a th:href="@{/vista/reembolsos}" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-arrow-counterclockwise me-1"></i> Registrar Solicitud
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
