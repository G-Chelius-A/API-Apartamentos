<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Reembolsos')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid px-4 py-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Gestión de Reembolsos</h3>
                <p class="text-muted small mb-0">Devoluciones vinculadas a pagos de reservaciones canceladas</p>
            </div>
            <a th:href="@{/vista/reembolsos/nuevo}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i> Solicitar Reembolso
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Pago Asociado</th>
                                <th>Monto Reembolsado ($)</th>
                                <th>Estado</th>
                                <th>Fecha Reembolso</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(reembolsos)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay reembolsos registrados.
                                </td>
                            </tr>
                            <tr th:each="rem : ${reembolsos}">
                                <td class="fw-bold" th:text="'#' + ${rem.idReembolso}">#1</td>
                                <td>
                                    <span class="fw-semibold" th:text="'Pago #' + ${rem.pago.idPago}">Pago #1</span>
                                    <small class="text-muted d-block" th:if="${rem.pago.reservacion != null}" 
                                           th:text="'Reserva ' + ${rem.pago.reservacion.codigoReserva} + ' (' + ${rem.pago.reservacion.estado} + ')'"></small>
                                </td>
                                <td class="fw-bold text-danger" th:text="'$' + ${rem.montoReembolso}">$500.00</td>
                                <td>
                                    <span th:class="'badge border text-capitalize ' + 
                                          (${rem.estado.name() == 'procesado'} ? 'bg-success-subtle text-success' : 
                                          (${rem.estado.name() == 'aprobado'} ? 'bg-primary-subtle text-primary' : 
                                          (${rem.estado.name() == 'pendiente'} ? 'bg-warning-subtle text-warning' : 'bg-danger-subtle text-danger')))"
                                          th:text="${rem.estado}">pendiente</span>

                                    <!-- Acciones rápidas cambio de estado -->
                                    <div class="dropdown d-inline ms-1" th:if="${rem.estado.name() == 'pendiente' or rem.estado.name() == 'aprobado'}">
                                        <button class="btn btn-sm btn-link text-muted p-0" data-bs-toggle="dropdown">
                                            <i class="bi bi-gear-fill"></i>
                                        </button>
                                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                            <li class="dropdown-header">Avanzar Estado</li>
                                            <li th:if="${rem.estado.name() == 'pendiente'}">
                                                <form th:action="@{/vista/reembolsos/{id}/cambiar-estado(id=${rem.idReembolso})}" method="post">
                                                    <input type="hidden" name="nuevoEstado" value="aprobado">
                                                    <button type="submit" class="dropdown-item py-1 text-primary">Aprobar</button>
                                                </form>
                                                <form th:action="@{/vista/reembolsos/{id}/cambiar-estado(id=${rem.idReembolso})}" method="post">
                                                    <input type="hidden" name="nuevoEstado" value="rechazado">
                                                    <button type="submit" class="dropdown-item py-1 text-danger">Rechazar</button>
                                                </form>
                                            </li>
                                            <li th:if="${rem.estado.name() == 'aprobado'}">
                                                <form th:action="@{/vista/reembolsos/{id}/cambiar-estado(id=${rem.idReembolso})}" method="post">
                                                    <input type="hidden" name="nuevoEstado" value="procesado">
                                                    <button type="submit" class="dropdown-item py-1 text-success">Procesar Reembolso</button>
                                                </form>
                                            </li>
                                        </ul>
                                    </div>
                                </td>
                                <td><small class="text-muted" th:text="${rem.fechaReembolso}">2026-10-13</small></td>
                                <td class="text-end">
                                    <form th:action="@{/vista/reembolsos/{id}/eliminar(id=${rem.idReembolso})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar este registro de reembolso?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
