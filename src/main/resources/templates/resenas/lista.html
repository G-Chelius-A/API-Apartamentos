<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Reseñas')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid px-4 py-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Reseñas y Calificaciones</h3>
                <p class="text-muted small mb-0">Opiniones de huéspedes sobre reservaciones completadas</p>
            </div>
            <a th:href="@{/vista/resenas/nueva}" class="btn btn-primary">
                <i class="bi bi-star me-1"></i> Nueva Reseña
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Reservación</th>
                                <th>Calificación General</th>
                                <th>Desglose (1-10)</th>
                                <th>Comentario</th>
                                <th>Fecha</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(resenas)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay reseñas registradas aún.
                                </td>
                            </tr>
                            <tr th:each="res : ${resenas}">
                                <td class="fw-bold" th:text="'#' + ${res.idResena}">#1</td>
                                <td>
                                    <span class="fw-semibold" th:text="${res.reservacion != null ? res.reservacion.codigoReserva : 'N/A'}">COD-123</span>
                                    <small class="text-muted d-block" th:if="${res.reservacion != null and res.reservacion.propiedad != null}" 
                                           th:text="${res.reservacion.propiedad.titulo}"></small>
                                </td>
                                <td>
                                    <span class="badge bg-warning text-dark fs-6">
                                        <i class="bi bi-star-fill text-dark me-1"></i>
                                        <span th:text="${res.calificacionGeneral} + '/10'">9/10</span>
                                    </span>
                                </td>
                                <td>
                                    <small class="text-muted">
                                        Limp: <strong th:text="${res.calificacionLimpieza}"></strong> | 
                                        Ubic: <strong th:text="${res.calificacionUbicacion}"></strong> | 
                                        Comun: <strong th:text="${res.calificacionComunicacion}"></strong>
                                    </small>
                                </td>
                                <td>
                                    <span th:text="${res.comentario ?: 'Sin comentario'}">Muy buena estancia</span>
                                    <div th:if="${res.respuestaPropietario != null}" class="small text-muted border-start ps-2 mt-1">
                                        <strong>Respuesta:</strong> <span th:text="${res.respuestaPropietario}"></span>
                                    </div>
                                </td>
                                <td><small class="text-muted" th:text="${res.fechaResena}">2026-10-13</small></td>
                                <td class="text-end">
                                    <form th:action="@{/vista/resenas/{id}/eliminar(id=${res.idResena})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar esta reseña?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
