<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Usuarios')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid px-4 py-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Cuentas de Usuarios</h3>
                <p class="text-muted small mb-0">Usuarios registrados (propietarios y clientes)</p>
            </div>
            <a th:href="@{/vista/usuarios/nuevo}" class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i> Nuevo Usuario
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre de Usuario</th>
                                <th>Correo Electrónico</th>
                                <th>Teléfono</th>
                                <th>Estado</th>
                                <th>Registro</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(usuarios)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay usuarios registrados.
                                </td>
                            </tr>
                            <tr th:each="u : ${usuarios}">
                                <td class="fw-bold" th:text="'#' + ${u.idUsuario}">#1</td>
                                <td>
                                    <i class="bi bi-person-circle me-1 text-primary"></i>
                                    <span class="fw-semibold" th:text="${u.username}">juan_perez</span>
                                </td>
                                <td><span th:text="${u.email}">juan@example.com</span></td>
                                <td><span class="text-muted" th:text="${u.telefono ?: 'N/A'}">555...</span></td>
                                <td>
                                    <span th:class="'badge border text-capitalize ' + 
                                          (${u.estado.name() == 'activo'} ? 'bg-success-subtle text-success' : 
                                          (${u.estado.name() == 'inactivo'} ? 'bg-secondary-subtle text-secondary' : 'bg-warning-subtle text-warning'))"
                                          th:text="${u.estado}">activo</span>
                                </td>
                                <td><small class="text-muted" th:text="${u.fechaRegistro}">2026-10-13</small></td>
                                <td class="text-end">
                                    <a th:href="@{/vista/usuarios/{id}/editar(id=${u.idUsuario})}" class="btn btn-sm btn-outline-secondary me-1">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/vista/usuarios/{id}/eliminar(id=${u.idUsuario})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar este usuario?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
