<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${habitacion.idHabitacion != null ? 'Editar Habitación' : 'Nueva Habitación'})}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container py-2" style="max-width: 650px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0" th:text="${habitacion.idHabitacion != null ? 'Editar Habitación #' + habitacion.idHabitacion : 'Nueva Habitación'}">Formulario Habitación</h3>
            <a th:href="@{/vista/habitaciones}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Regresar
            </a>
        </div>

        <div class="card p-4">
            <form th:action="@{/vista/habitaciones/guardar}" th:object="${habitacion}" method="post">
                <input type="hidden" th:field="*{idHabitacion}"/>

                <div class="row g-3">
                    <div class="col-12" th:if="${habitacion.idHabitacion == null}">
                        <label class="form-label fw-semibold">Casa a la que Pertenece *</label>
                        <select th:field="*{casa.idCasa}" class="form-select" required>
                            <option value="">-- Seleccionar Casa --</option>
                            <option th:each="c : ${casas}" th:value="${c.idCasa}" th:text="'Casa #' + ${c.idCasa} + (c.unidad != null ? ' - ' + c.unidad.titulo : '')"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Número de Habitación / Cuarto *</label>
                        <input type="number" th:field="*{numero}" class="form-control" min="1" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Piso en el que se ubica *</label>
                        <input type="number" th:field="*{piso}" class="form-control" min="1" required/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tipo de Habitación *</label>
                        <select th:field="*{tipoHabitacion}" class="form-select" required>
                            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                        </select>
                        <small class="text-muted">individual (1p), matrimonial (2p), familiar (4p)</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Metros Cuadrados (m²) *</label>
                        <input type="number" step="0.01" th:field="*{metrosCuadrados}" class="form-control" min="1" required/>
                    </div>

                    <div class="col-12 mt-4 text-end">
                        <a th:href="@{/vista/habitaciones}" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Guardar Habitación
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
