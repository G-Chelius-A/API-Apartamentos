<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Habitaciones')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid px-4 py-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Habitaciones</h3>
                <p class="text-muted small mb-0">Distribución de recámaras por casa</p>
            </div>
            <a th:href="@{/vista/habitaciones/nueva}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i> Nueva Habitación
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Casa Asociada</th>
                                <th>Número</th>
                                <th>Piso</th>
                                <th>Tipo de Habitación</th>
                                <th>Metros Cuadrados</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(habitaciones)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay habitaciones registradas.
                                </td>
                            </tr>
                            <tr th:each="h : ${habitaciones}">
                                <td class="fw-bold" th:text="'#' + ${h.idHabitacion}">#1</td>
                                <td>
                                    <span class="fw-semibold" th:text="'Casa #' + ${h.casa.idCasa}">Casa #1</span>
                                    <small class="text-muted d-block" th:if="${h.casa.unidad != null}" th:text="${h.casa.unidad.titulo}"></small>
                                </td>
                                <td><span class="badge bg-secondary" th:text="'Hab. ' + ${h.numero}">Hab. 1</span></td>
                                <td><span th:text="'Piso ' + ${h.piso}">Piso 1</span></td>
                                <td>
                                    <span class="badge bg-info-subtle text-info border text-capitalize" th:text="${h.tipoHabitacion}">matrimonial</span>
                                </td>
                                <td class="fw-semibold" th:text="${h.metrosCuadrados} + ' m²'">18.5 m²</td>
                                <td class="text-end">
                                    <a th:href="@{/vista/habitaciones/{id}/editar(id=${h.idHabitacion})}" class="btn btn-sm btn-outline-secondary me-1">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/vista/habitaciones/{id}/eliminar(id=${h.idHabitacion})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar esta habitación?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
