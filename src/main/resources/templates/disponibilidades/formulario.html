<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${disponibilidad.idDisponibilidad != null ? 'Editar Disponibilidad' : 'Habilitar Periodo'})}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container py-2" style="max-width: 650px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0" th:text="${disponibilidad.idDisponibilidad != null ? 'Editar Periodo #' + disponibilidad.idDisponibilidad : 'Nuevo Periodo de Disponibilidad'}">Formulario Disponibilidad</h3>
            <a th:href="@{/vista/disponibilidades}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Regresar
            </a>
        </div>

        <div class="card p-4">
            <form th:action="@{/vista/disponibilidades/guardar}" th:object="${disponibilidad}" method="post">
                <input type="hidden" th:field="*{idDisponibilidad}"/>

                <div class="row g-3">
                    <div class="col-12" th:if="${disponibilidad.idDisponibilidad == null}">
                        <label class="form-label fw-semibold">Unidad Rentable *</label>
                        <select th:field="*{unidad.idUnidad}" class="form-select" required>
                            <option value="">-- Seleccionar Unidad --</option>
                            <option th:each="u : ${unidades}" th:value="${u.idUnidad}" th:text="'#' + ${u.idUnidad} + ' - ' + ${u.titulo} + ' ($' + ${u.precioNoche} + ')'"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Fecha de Inicio *</label>
                        <input type="date" th:field="*{fechaInicio}" class="form-control" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Fecha de Fin *</label>
                        <input type="date" th:field="*{fechaFin}" class="form-control" required/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Precio Especial / Descuento ($)</label>
                        <input type="number" step="0.01" th:field="*{precioEspecial}" class="form-control" placeholder="Opcional"/>
                        <small class="text-muted">Si se deja vacío, aplica el precio regular por noche de la unidad.</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Estado de Disponibilidad</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" th:field="*{disponible}" id="disponible">
                            <label class="form-check-label fw-semibold" for="disponible">Habilitado para reservas</label>
                        </div>
                    </div>

                    <div class="col-12 mt-4 text-end">
                        <a th:href="@{/vista/disponibilidades}" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Guardar Periodo
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
