<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Galería de Imágenes')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid px-4 py-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Imágenes de Unidades</h3>
                <p class="text-muted small mb-0">Registro fotográfico y multimedia de los alojamientos</p>
            </div>
            <a th:href="@{/vista/imagenes/nueva}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i> Agregar Imagen
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Unidad Rentable</th>
                                <th>URL / Enlace</th>
                                <th>Orden</th>
                                <th>Principal</th>
                                <th>Fecha Subida</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(imagenes)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay imágenes registradas.
                                </td>
                            </tr>
                            <tr th:each="img : ${imagenes}">
                                <td class="fw-bold" th:text="'#' + ${img.idImagen}">#1</td>
                                <td>
                                    <span class="fw-semibold" th:text="${img.unidad != null ? img.unidad.titulo : 'Unidad #' + img.unidad.idUnidad}">Apartamento</span>
                                </td>
                                <td>
                                    <a th:href="${img.urlImagen}" target="_blank" class="text-truncate d-inline-block text-primary" style="max-width: 300px;" th:text="${img.urlImagen}">https://...</a>
                                </td>
                                <td><span class="badge bg-secondary" th:text="${img.orden}">1</span></td>
                                <td>
                                    <span th:if="${img.esPrincipal}" class="badge bg-success-subtle text-success border"><i class="bi bi-star-fill me-1"></i> Principal</span>
                                    <span th:unless="${img.esPrincipal}" class="badge bg-light text-muted border">Secundaria</span>
                                </td>
                                <td><small class="text-muted" th:text="${img.fechaSubida}">2026-10-13</small></td>
                                <td class="text-end">
                                    <form th:action="@{/vista/imagenes/{id}/eliminar(id=${img.idImagen})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar esta imagen?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
