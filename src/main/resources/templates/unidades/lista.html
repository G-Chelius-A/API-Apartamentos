<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Unidades Rentables')}"></head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid px-4 py-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 class="fw-bold mb-0">Unidades Rentables</h3>
                <p class="text-muted small mb-0">Catálogo general de alojamientos disponibles para renta</p>
            </div>
            <a th:href="@{/vista/unidades/nueva}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i> Nueva Unidad
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Ubicación</th>
                                <th>Propietario</th>
                                <th>Capacidad</th>
                                <th>Precio/Noche</th>
                                <th>Características</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(unidades)}">
                                <td colspan="8" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay unidades rentables registradas.
                                </td>
                            </tr>
                            <tr th:each="u : ${unidades}">
                                <td class="fw-bold" th:text="'#' + ${u.idUnidad}">#1</td>
                                <td>
                                    <div class="fw-semibold" th:text="${u.titulo}">Apartamento Centro</div>
                                    <small class="text-muted text-truncate d-inline-block" style="max-width: 250px;" th:text="${u.descripcion}"></small>
                                </td>
                                <td>
                                    <span th:text="${u.ciudad} + ', ' + ${u.entidad}">CDMX</span><br>
                                    <small class="text-muted" th:text="${u.direccion}">Reforma 100</small>
                                </td>
                                <td>
                                    <span class="badge bg-secondary-subtle text-secondary border" 
                                          th:text="${u.propietario != null ? u.propietario.username : 'N/A'}">propietario</span>
                                </td>
                                <td>
                                    <i class="bi bi-people me-1"></i><span th:text="${u.capacidadPersonas} + ' pers.'">4 pers.</span>
                                </td>
                                <td class="fw-bold text-success" th:text="'$' + ${u.precioNoche}">$1250.00</td>
                                <td>
                                    <span th:if="${u.petFriendly}" class="badge bg-info-subtle text-info border me-1" title="Acepta mascotas"><i class="bi bi-check"></i> Pet</span>
                                    <span th:if="${u.accesibilidad}" class="badge bg-light text-dark border" title="Accesibilidad"><i class="bi bi-check"></i> Acceso</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/vista/unidades/{id}/editar(id=${u.idUnidad})}" class="btn btn-sm btn-outline-secondary me-1" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/vista/unidades/{id}/eliminar(id=${u.idUnidad})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Está seguro de eliminar esta unidad rentable?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
